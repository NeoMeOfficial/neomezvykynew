[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# admin.neome.com.au subdomain — root path 301s to /admin so the admin
# SPA mounts immediately. After the redirect the URL bar reads
# https://admin.neome.com.au/admin and React Router handles nested
# navigation from there. The SPA catchall below serves index.html for
# every other path (including /admin, /admin/referrals, etc.).
[[redirects]]
  from = "/"
  to = "/admin"
  status = 301
  conditions = { Host = ["admin.neome.com.au"] }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
