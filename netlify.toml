[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# admin.neome.com.au — the subdomain redirect to /admin is now done
# client-side in AppV2.tsx (Netlify's host-conditional redirect didn't
# fire reliably). The SPA catchall below serves index.html for every
# path; the SPA reads window.location.hostname to decide whether to
# render Welcome or Navigate to /admin.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
