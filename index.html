<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Fonts: Bodoni Moda (display/editorial) + DM Sans (body) — matches NeoMe website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Gilda+Display&display=swap">
    <style>
      /* Ensure full width on mobile */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root {
        width: 100vw;
        max-width: 100vw;
      }
    </style>
    <title>NeoMe — Wellness pre ženy</title>

    <!-- PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon-source.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NeoMe" />
    <meta name="theme-color" content="#F0E6DA" />
    <meta name="description" content="NeoMe je tvoj osobný wellness sprievodca. Cvičenia, výživa, menštruačný cyklus a meditácie — všetko na jednom mieste." />
    <meta name="author" content="NeoMe" />

    <meta property="og:title" content="NeoMe — Wellness pre ženy" />
    <meta property="og:description" content="Tvoj osobný wellness sprievodca. Cvičenia, výživa, menštruačný cyklus a meditácie." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/neome-og.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@neome_wellness" />
    <meta name="twitter:image" content="/images/neome-og.png" />
  </head>

  <body>
    <div id="root"></div>
    <!--
      Escape hatch: visit /?clear=1 to force-clear the PWA service
      worker and caches, then reload. Runs before the app bundle so it
      works even if the cached bundle is broken.
    -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get('clear') !== '1') return;
          var safety = setTimeout(function () {
            window.location.replace('/?_r=' + Date.now());
          }, 1500);
          Promise.allSettled([
            navigator.serviceWorker
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
                })
              : Promise.resolve(),
            window.caches
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); }));
                })
              : Promise.resolve(),
          ]).then(function () {
            clearTimeout(safety);
            window.location.replace('/?_r=' + Date.now());
          });
        } catch (e) {
          window.location.replace('/?_r=' + Date.now());
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
